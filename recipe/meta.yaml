{% set name = "elpigraph-python" %}
{% set version = "0.3.4" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d08668ca78be7c278021d17e93ab021a76806f8e307a937ff94a3ad043ec0b4a

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - numpy >=1.16.2
    - pandas >=0.23.4
    - numba >=0.49.1
    - scikit-learn >=0.21.3
    - scipy >=1.2.0
    - python-igraph >=0.7.1
    - matplotlib-base
    - shapely
    - networkx

test:
  imports:
    - elpigraph
    - elpigraph.src
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/j-bac/elpigraph-python
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: 'Elastic Principal Graphs algorithm (ElPiGraph) for Python'

  description: |
    elpigraph-python is a package implementing the Elastic Principal Graphs algorithm for manifold learning.
  doc_url: https://elpigraph-python.readthedocs.io/
  dev_url: https://github.com/elpigraph-python/elpigraph/

extra:
  recipe-maintainers:
    - j-bac
    - auranic
